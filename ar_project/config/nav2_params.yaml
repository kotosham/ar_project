bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    # Milliseconds. 20 ms is too tight on the real robot with rmw_zenoh and can
    # make BT abort before planner_server acknowledges ComputePathToPose.
    default_server_timeout: 2000
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    # Phase 2.7: lightened for Pi (was 15.0). DWB at 10 Hz is sufficient for the
    # 0.26 m/s platform and frees CPU for perception/transport.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    # Tolerate the slow (~2 Hz) RTAB-Map map->odom TF on WSL2 (see FollowPath note).
    transform_tolerance: 1.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Hardware VLM mode uses edge RTAB-Map over Wi-Fi/zenoh, so map->odom is
      # less smooth than onboard SLAM. Accept a practical approach pose instead
      # of making the robot spin in place to satisfy centimeter/degree precision.
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.35
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 12
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      # WSL2: RTAB-Map (SLAM) publishes map->odom at only ~2 Hz, so that TF lags
      # up to ~0.5 s. With the old 0.2 s the controller could not transform the
      # robot pose into the map-frame global plan ("Transform data too old
      # converting from odom to map") and EVERY navigate goal aborted. 1.0 s
      # comfortably bridges the slow SLAM TF (harmless on a 0.26 m/s platform).
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.20
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      # odom->base_link comes fast from gz, but keep a generous tolerance so a
      # transient WSL2 stall never drops the local costmap's robot pose.
      transform_tolerance: 1.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.275, 0.191], [0.275, -0.191], [-0.085, -0.191], [-0.085, 0.191]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # Phase 1.4: obstacles come from the local /scan (depthimage_to_laserscan),
        # not PointCloud2 — keeps raw depth/PointCloud2 off the Wi-Fi link.
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      # Phase 2.7: removed dead static_layer block (not in plugins list above;
      # the rolling local costmap in `odom` carries no static map).
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      # The published /global_costmap/costmap topic is VIZ-ONLY (planner_server
      # uses the costmap in-process). On hardware this topic crosses Wi-Fi to
      # RViz on the edge, and a full 40x40 m @0.05 grid is ~640 kB per publish.
      # 0.0 disables the publisher entirely (no functional impact on planning).
      # For RViz on the edge, bump to 0.5 -- always_send_full_costmap:False below
      # then sends cheap incremental updates instead of the whole grid.
      publish_frequency: 0.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      # Tolerate the slow (~2 Hz) RTAB-Map map->odom TF on WSL2 (default 0.3 was
      # too tight -> the global costmap could not place the robot in the map).
      transform_tolerance: 1.0
      footprint: "[[0.275, 0.191], [0.275, -0.191], [-0.085, -0.191], [-0.085, 0.191]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # Phase 2.7: in SLAM/FLAT mode the /map occupancy grid is published by
        # RTAB-Map (not map_server — map_server is not launched in this stack).
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      # Send incremental costmap updates, not the full grid, whenever the global
      # costmap topic IS published (see publish_frequency above). Halves-to-tiny
      # the per-message size over Wi-Fi when viewing in RViz.
      always_send_full_costmap: False

map_server:
  ros__parameters:
    use_sim_time: False
    # Phase 2.7: map_server is NOT launched in this stack — the /map occupancy
    # grid comes from RTAB-Map (SLAM). This block is retained only so a static
    # pre-built map can be served later (set yaml_filename + add to a launch).
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # Phase 2.7: replanning is event-driven (on goal / RecoveryNode), not a hot
    # loop. 1.0 Hz only sets the "planner too slow" warning floor; was 20.0.
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# Phase 2.7: smoother_server dropped. The default NavigateToPose BT does not call
# SmoothPath; DWB + velocity_smoother already shape the trajectory. Removing it
# saves a lifecycle node + costmap subscription on the Pi.

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Phase 2.7: trimmed to spin/backup/wait (the recoveries the default BT uses);
    # dropped drive_on_heading + assisted_teleop (unused by the executive).
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    # Tolerate the slow (~2 Hz) RTAB-Map TF on WSL2 (was 0.1 -> recoveries aborted).
    transform_tolerance: 1.0
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

# Phase 2.7: waypoint_follower dropped. The executive drives single NavigateToPose
# goals through the skill servers (no FollowWaypoints/multi-waypoint missions).

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
