twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      navigation:
        # Fed by cmd_vel_watchdog (Phase 0.5): pass-through of Nav2 /cmd_vel
        # while fresh, deterministic zero + HOLD when the planner goes stale.
        topic   : cmd_vel_safe
        timeout : 0.5
        priority: 10
      tracker:
        topic   : cmd_vel_tracker
        timeout : 0.5
        priority: 20
      joystick:
        topic   : cmd_vel_joy
        timeout : 0.5
        priority: 100
