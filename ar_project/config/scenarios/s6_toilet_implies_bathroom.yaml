# s6_toilet_implies_bathroom -- "найти ванную по унитазу"
#
# ЧТО ДИАГНОСТИРУЕТ
#   Семантический вывод от объекта к помещению. mission = "bathroom", но это НЕ
#   класс детектора: DETECT_ALL никогда не вернёт метку "bathroom". Он вернёт
#   "toilet" / "sink" / "bathtub". Планировщик обязан сам сделать шаг
#   "вижу унитаз -> эта комната и есть ванная -> цель достигнута здесь".
#   Провал типовой: бесконечный DETECT_ALL в поисках объекта с меткой
#   "bathroom", затем отказ или таймаут.
#
# ГЕОМЕТРИЯ ВИДИМОСТИ УНИТАЗА (bath_toilet зафиксирован в house.sdf на -1.30, 2.50)
#   Проём ванной -- x -0.55..0.55 на стене y = 1.1. Конус видимости через проём
#   узкий и зависит от того, с какой стороны смотреть:
#     из точки (0.00, 0.10) видимый диапазон на y = 2.5 -> x -1.32..+1.32,
#         унитаз на -1.30 оказывается ровно на краю -- ненадёжно;
#     из точки (0.60, 0.15) видимый диапазон на y = 2.5 -> x -2.34..+0.47,
#         унитаз уверенно внутри.
#   Поэтому робот стартует ВОСТОЧНЕЕ проёма и едет на запад: подходящая точка
#   обзора возникает у него на пути естественно. Унитаз при этом лежит вне
#   стартового FOV (bearing ~50 градусов от курса), так что увидеть его можно
#   только повернувшись -- активный поиск остаётся частью задачи.
id: s6_toilet_implies_bathroom
title: "Найти ванную по унитазу"
description: >-
  Цель задана как ПОМЕЩЕНИЕ, а не как объект. Детектор возвращает "toilet";
  планировщик должен вывести, что это и есть ванная, и войти в неё.
mission: bathroom

robot_start: {x: 3.20, y: 0.00, yaw: 3.1416}

spawn:
  - {model: clutter_pile, name: clutter_hall, x: 1.60, y: -0.70, z: 0.0, yaw: 0.0}

lights_off: []

subgoals:
  - {id: g1_at_viewpoint, type: near_xy, x: 0.60, y: 0.15, radius: 0.90}
  - {id: g2_saw_toilet, type: saw_label, label: toilet, min_conf: 0.12}
  - {id: g3_in_bathroom, type: in_room, room: bathroom}

success: {type: all_subgoals}
timeout_s: 200
max_path_m: 30.0
diagnoses: [semantic_inference, room_level_goal, affordance_reasoning]
