# s7_neighbor_room -- "ванная -- соседняя комната"
#
# ЧТО ДИАГНОСТИРУЕТ
#   Пространственное рассуждение о смежности комнат без единой визуальной
#   подсказки. Робот стоит ВНУТРИ кухни лицом на запад -- в глухую перегородку
#   x = 2.0, отделяющую кухню от ванной. Ванная буквально за этой стеной, но
#   двери между ними нет: единственный путь -- кухонная дверь (x 3.60..4.70 на
#   стене y = 1.1), коридор, дверь ванной (x -0.55..0.55).
#   Корректная стратегия: понять, что "рядом" не значит "напрямую", выйти из
#   комнаты и искать вход снаружи. Провал типовой: упереться в перегородку и
#   крутиться, либо уйти исследовать кухню целиком.
#
#   Именно поэтому здесь НЕТ указателей: s5 уже меряет чтение разметки, а s7
#   должен мерить чистую топологию. Единственный сигнал -- геометрия дома,
#   которую планировщик получает через occupancy grid в промпте (send_map).
#
# СТАРТОВАЯ ПОЗА
#   (5.60, 3.00) свободна: kitchen_counter x 3.0..6.0 / y 4.25..4.85,
#   kitchen_table x 3.0..4.2 / y 2.2..3.0, kitchen_fridge x 6.6..7.3.
id: s7_neighbor_room
title: "Ванная -- соседняя комната"
description: >-
  Старт внутри кухни лицом в глухую стену; ванная за ней, но попасть туда можно
  только через коридор. Диагностирует рассуждение о смежности и выход из
  комнаты до начала поиска.
mission: bathroom

robot_start: {x: 5.60, y: 3.00, yaw: 3.1416}

spawn: []

lights_off: []

subgoals:
  - {id: g1_at_kitchen_door, type: near_xy, x: 4.15, y: 1.60, radius: 0.90}
  - {id: g2_in_hallway, type: in_room, room: hallway}
  - {id: g3_at_bathroom_door, type: near_xy, x: 0.60, y: 0.15, radius: 0.90}
  - {id: g4_in_bathroom, type: in_room, room: bathroom}

success: {type: all_subgoals}
timeout_s: 240
max_path_m: 40.0
diagnoses: [spatial_reasoning, room_adjacency, exit_before_search]
