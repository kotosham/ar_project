# ctl_reachable -- ПОЛОЖИТЕЛЬНЫЙ КОНТРОЛЬ (не входит в семёрку сценариев).
#
# ЗАЧЕМ
#   Тот же дом и тот же стул, что в s1, но робот стоит в 4.6 м от цели -- внутри
#   дальности глубины (8 м) и на дистанции, где детектор даёт conf ~0.86. Здесь
#   НЕТ ни одной из семи трудностей: цель видна, дальность известна, комната та же.
#   Единственное назначение -- доказать, что цепочка детектор -> глубина ->
#   set-of-mark -> оркестратор -> skill server -> Nav2 -> оракул физически
#   способна выдать outcome=success в этом мире. Без такого контроля нули в
#   семёрке нельзя отличить от сломанного стенда.
#
# КАК ЧИТАТЬ
#   flat_mock обязан решать контроль стабильно (замерено: success, 1.000,
#   ~2.9 м пути, 2 шага). Если контроль падает -- сломан стенд, интерпретировать
#   остальные эпизоды прогона нельзя. Реальный кейс, который этот файл поймал:
#   недобитый coordinator_node от предыдущего эпизода -> два action-сервера ->
#   команды движения терялись -> path_length 0.00 при исправном детекторе.
#   Контроль также годится для проверки помех в изоляции: p_dirty_lens и
#   p_carpet стоят на нём один лишний шаг, p_dark_room роняет его полностью.
id: ctl_reachable
title: "Контроль: цель в прямой видимости и в пределах глубины"
description: >-
  Стул в 4.6 м прямо по курсу. Проверка исправности всей цепочки, а не
  способностей планировщика.
mission: chair

robot_start: {x: 1.00, y: 0.00, yaw: 0.0}

spawn:
  # Тот же стул и та же поза, что в s1: спинка на восток, широкой стороной к роботу.
  - {model: target_chair, name: target, x: 5.60, y: 0.00, z: 0.0, yaw: 1.5708}

lights_off: []

subgoals:
  - {id: g1_at_target, type: near_xy, x: 4.70, y: 0.00, radius: 0.90}

success: {type: all_subgoals}
timeout_s: 150
max_path_m: 20.0
diagnoses: [control]
