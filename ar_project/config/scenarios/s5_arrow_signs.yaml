# s5_arrow_signs -- "стрелки-указатели маршрута"
#
# ЧТО ДИАГНОСТИРУЕТ
#   Следует ли планировщик указателю, ОТНОСЯЩЕМУСЯ К ЕГО ЦЕЛИ, и игнорирует ли
#   указатель на другую комнату. Полотенце висит в ванной (-1.20, 3.60), из
#   коридора не видно. По коридору стоят ДВА щита:
#     x = -3.20  "ВАННАЯ ^"   -- маршрутный указатель, встречается ПЕРВЫМ
#     x = -1.20  "КУХНЯ ->"   -- дистрактор, встречается ПОСЛЕДНИМ
#
# ПОЧЕМУ ДВА, А НЕ ТРИ
#   Щит надо прочитать ЦЕЛИКОМ, а для этого нужно ~2.8 м продольного разгона
#   (см. геометрию ниже). Робот стартует в 2.4 м от западной стены, поэтому
#   любой щит западнее проёма спальни он минует раньше, чем тот войдёт в кадр.
#   Восточнее проёма ванной щиты уже бесполезны -- дверь пройдена. Остаётся
#   участок между проёмами, куда с нужным разгоном помещаются два щита.
#
# ПОЧЕМУ ДИСТРАКТОР ИДЁТ ПОСЛЕДНИМ
#   Так наказывается эвристика "делай, что сказал последний увиденный знак":
#   верный указатель встречается раньше, а прямо перед дверью ванной робот видит
#   корректный, но нерелевантный "КУХНЯ ->" и, поддавшись ему, проезжает мимо.
#   Кухня действительно восточнее, то есть щит НЕ врёт -- он просто не про эту
#   миссию. Ложный щит измерял бы доверчивость, а нужно целеобусловленное чтение.
#
# СЕМАНТИКА СТРЕЛОК
#   Робот читает щит, двигаясь на восток, поэтому стрелка трактуется как в кадре:
#   "->" = дальше в ту сторону, "^" = прямо / сюда внутрь. Обе трактовки здесь
#   фактически верны, двусмысленности нет.
#
# ГЕОМЕТРИЯ ЩИТА -- ПОЧЕМУ ОН ПЕРПЕНДИКУЛЯРЕН СТЕНЕ
#   Камера робота на высоте 0.13 м, полуугол обзора 31.2 градуса. Отсюда два
#   отвергнутых варианта и один рабочий, все проверены живым рендером:
#     1) щит плашмя на стене (yaw 0) -- стоит под 90 градусов к движению, робот,
#        едущий на восток, не видит его вообще;
#     2) щит под наклоном -25 градусов -- дальний край разворачивается на север
#        И на запад, его пеленг вырастает до 35 градусов, и край кадра срезает
#        пол-щита; чтобы он влез целиком, надо отъехать так далеко, что текст
#        становится нечитаемым;
#     3) РАБОЧИЙ: щит развёрнут перпендикулярно стене лицом строго на запад
#        (yaw -1.5708) -- "флаг", как в настоящих коридорах. Робот подъезжает
#        к нему почти по нормали: ракурс ~19 градусов вместо 44, щит виден на
#        93% своей ширины вместо 72%, и при этом его габарит по x -- всего 5 см,
#        так что он физически не может перекрыть дверной проём.
#   Щит 1.00 x 0.56 м, центр y = 0.54 -- полотно занимает y 0.04..1.04 и
#   выступает в коридор на 1.0 м, оставляя 1.08 м прохода южнее. Путевые точки
#   заданы на y = -0.45, по свободной полосе.
#   Оба щита: x = -3.20 и x = -1.20, y = 0.54, yaw = -1.5708. Маршрутный
#   читается из точки g1 (-6.00, -0.45) -- 2.80 м, пеленги краёв 9.9 и 28.0
#   градуса. Дистрактор попадает в кадр по дороге, около x = -4.00.
id: s5_arrow_signs
title: "Стрелки-указатели маршрута"
description: >-
  Полотенце в ванной; маршрут размечен стрелками, последняя из которых -- верный,
  но нерелевантный указатель на другую комнату. Диагностирует чтение символьной
  разметки и устойчивость к дистрактору.
mission: towel

robot_start: {x: -7.00, y: 0.00, yaw: 0.0}

spawn:
  - {model: sign_arrow_up, name: sign_route, x: -3.20, y: 0.54, z: 0.0, yaw: -1.5708}
  - {model: sign_arrow_right, name: sign_decoy, x: -1.20, y: 0.54, z: 0.0, yaw: -1.5708}
  # Полотенце: чисто между bath_toilet (y 2.25..2.75) и bath_tub (y 4.03..4.78).
  - {model: target_towel, name: target, x: -1.20, y: 3.60, z: 0.0, yaw: 0.0}

lights_off: []

subgoals:
  # -6.00 -- точка, с которой маршрутный щит целиком попадает в кадр (2.80 м до него).
  # РАДИУС 0.60, А НЕ 1.20. При 1.20 подцель была ВЫРОЖДЕННОЙ: от точки старта
  # (-7.00, 0.00) до (-6.00, -0.45) ровно 1.097 м, то есть она засчитывалась
  # ещё до первого движения. Замерено: неподвижный flat_mock (путь 0.00 м,
  # 6 поворотов на месте) получал за неё ordered_progress 0.250. При 0.60 робот
  # обязан реально доехать до x = -6.0: на курсе y ~ 0 промах по y равен 0.45 м,
  # что внутри радиуса, так что подцель остаётся достижимой при езде по прямой.
  - {id: g1_read_route_sign, type: near_xy, x: -6.00, y: -0.45, radius: 0.60}
  - {id: g2_at_bathroom_door, type: near_xy, x: -0.10, y: -0.45, radius: 1.00}
  - {id: g3_in_bathroom, type: in_room, room: bathroom}
  - {id: g4_at_target, type: near_xy, x: -1.20, y: 2.90, radius: 1.00}

success: {type: all_subgoals}
timeout_s: 240
max_path_m: 45.0
diagnoses: [ocr, symbolic_signage, distractor_resistance]
