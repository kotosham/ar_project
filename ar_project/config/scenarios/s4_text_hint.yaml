# s4_text_hint -- "текстовая подсказка на стене"
#
# ЧТО ДИАГНОСТИРУЕТ
#   Читает ли планировщик текст в кадре и превращает ли его в маршрут.
#   Кружка лежит на кухне (5.20, 3.20) и НЕ видна ниоткуда из коридора.
#   Единственный дешёвый источник информации -- щит "КРУЖКА — НА КУХНЕ /
#   CUP -> KITCHEN" в коридоре. Без чтения текста сценарий решается только
#   полным фронтир-обходом дома, что видно по path_length и по времени.
#   Метрика "помог ли planner" здесь особенно наглядна: MockPlanner (flat)
#   текст не читает в принципе.
#
# ГЕОМЕТРИЯ ЩИТА -- ПОЧЕМУ ОН ПЕРПЕНДИКУЛЯРЕН СТЕНЕ
#   Камера робота на высоте 0.13 м, полуугол обзора 31.2 градуса. Отсюда два
#   отвергнутых варианта и один рабочий, все проверены живым рендером:
#     1) щит плашмя на стене (yaw 0) -- стоит под 90 градусов к движению, робот,
#        едущий на восток, не видит его вообще;
#     2) щит под наклоном -25 градусов -- дальний край разворачивается на север
#        И на запад, его пеленг вырастает до 35 градусов, и край кадра срезает
#        пол-щита; чтобы он влез целиком, надо отъехать так далеко, что текст
#        становится нечитаемым;
#     3) РАБОЧИЙ: щит развёрнут перпендикулярно стене лицом строго на запад
#        (yaw -1.5708) -- "флаг", как в настоящих коридорах. Робот подъезжает
#        к нему почти по нормали: ракурс ~19 градусов вместо 44, щит виден на
#        93% своей ширины вместо 72%, и при этом его габарит по x -- всего 5 см,
#        так что он физически не может перекрыть дверной проём.
#   Щит 1.00 x 0.56 м, центр y = 0.54 -- полотно занимает y 0.04..1.04 и
#   выступает в коридор на 1.0 м, оставляя 1.08 м прохода южнее. Путевые точки
#   заданы на y = -0.45, по свободной полосе.
#   Точка чтения g1 = (-5.30, -0.45): 2.90 м до щита, края полотна дают пеленги
#   9.6 и 27.2 градуса -- щит целиком в кадре, ширина ~170 px из 640.
id: s4_text_hint
title: "Текстовая подсказка на стене"
description: >-
  Кружка спрятана на кухне; в коридоре стоит щит с текстом, где она.
  Диагностирует OCR и перевод прочитанного в цель навигации.
mission: cup

robot_start: {x: -7.00, y: 0.00, yaw: 0.0}

spawn:
  # x = -2.40 -- вне проёмов спальни (-4.60..-3.50) и ванной (-0.55..0.55).
  - {model: sign_cup_kitchen, name: hint, x: -2.40, y: 0.54, z: 0.0, yaw: -1.5708}
  # Кружка на кухне, в стороне от counter (y 4.25..4.85) и table (x 3.0..4.2).
  - {model: target_cup, name: target, x: 5.20, y: 3.20, z: 0.0, yaw: 0.0}

lights_off: []

subgoals:
  - {id: g1_read_sign, type: near_xy, x: -5.30, y: -0.45, radius: 1.20}
  - {id: g2_in_kitchen, type: in_room, room: kitchen}
  - {id: g3_at_target, type: near_xy, x: 5.20, y: 2.50, radius: 1.00}

success: {type: all_subgoals}
timeout_s: 240
max_path_m: 45.0
diagnoses: [ocr, text_grounding, semantic_routing]
