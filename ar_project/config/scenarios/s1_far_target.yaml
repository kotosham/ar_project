# s1_far_target -- "цель за пределами дальности лидара"
#
# ЧТО ДИАГНОСТИРУЕТ
#   Умеет ли планировщик двигаться к цели, для которой НЕТ дальномерных данных.
#   Робот стоит в западном торце коридора, цель (стул) -- в восточном, 12.6 м.
#   Глубинная камера и /scan обрезаны на 8.0 м (depth_far), цветная -- на 30 м
#   (cam_far). То есть стул ВИДЕН, но расстояние до него неизвестно (NaN), и
#   DRIVE_TO_VISIBLE по нему невозможен, пока робот не подъедет ближе 8 м.
#   Корректная стратегия: серия DRIVE_FORWARD вдоль коридора, пока цель не
#   попадёт в диапазон глубины, и только потом подход. Это и есть проверка
#   "VLM разбивает один большой шаг на несколько".
#
# ПОЧЕМУ ИМЕННО СТУЛ И ИМЕННО 12.6 м
#   На 12.6 м масштаб ~42 px/м при 640x480. Кружка (0.09 м) = 4 px -- сценарий
#   был бы обманом. Стул (0.42 x 0.85 м) = ~18 x 36 px -- реально различим и
#   при этом всё ещё далеко за пределом глубины. Ближе 8 м сценарий вырождается
#   в обычный подход.
id: s1_far_target
title: "Цель за пределами дальности лидара"
description: >-
  Стул стоит в 12.6 м по прямому коридору. RGB его видит, depth/scan -- нет.
  Планировщик обязан декомпозировать подход на несколько шагов вперёд вместо
  одного DRIVE_TO_VISIBLE.
mission: chair

robot_start: {x: -7.00, y: 0.00, yaw: 0.0}

spawn:
  # yaw 1.5708 разворачивает спинку стула на восток -- робот, подъезжающий с
  # запада, видит её широкой стороной, а не торцом в 5 см.
  - {model: target_chair, name: target, x: 5.60, y: 0.00, z: 0.0, yaw: 1.5708}
  # Коридор не должен быть пустой трубой: две кучи у стен дают Nav2 и детектору
  # что-то помимо цели, но оставляют >1.4 м прохода.
  - {model: clutter_pile, name: clutter_w, x: -1.20, y: 0.72, z: 0.0, yaw: 0.0}
  - {model: clutter_pile, name: clutter_e, x: 2.30, y: -0.70, z: 0.0, yaw: 0.0}

lights_off: []

subgoals:
  - {id: g1_third_way, type: near_xy, x: -2.00, y: 0.00, radius: 1.20}
  - {id: g2_two_third, type: near_xy, x: 2.00, y: 0.00, radius: 1.20}
  - {id: g3_at_target, type: near_xy, x: 4.70, y: 0.00, radius: 0.90}

success: {type: all_subgoals}
timeout_s: 240
max_path_m: 45.0
diagnoses: [depth_gap, multi_step_decomposition, long_horizon]
