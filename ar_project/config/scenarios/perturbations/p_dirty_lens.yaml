# p_dirty_lens -- "заляпанная камера"
#
# ЧТО МОДЕЛИРУЕТ
#   Отпечаток пальца / брызги / пыль на объективе. Ключевой момент: грязь НЕ
#   затемняет кадр равномерно. Она локально уничтожает высокие частоты -- в
#   пятне картинка размывается и слегка светлеет от рассеяния, а вне пятна
#   остаётся резкой. Именно это ломает детектор и OCR, а равномерное затемнение
#   (это p_dark_room) ломает совсем другое.
#   Нода sim_perturbations строит маску пятен один раз по seed, поэтому в
#   пределах эпизода грязь неподвижна относительно объектива -- как и должно
#   быть.
#
#   blur_sigma 1.6 добавляет лёгкую общую расфокусировку поверх пятен: линза
#   в грязи почти всегда ещё и хуже фокусируется.
#   Сильнее всего бьёт по s4/s5 (OCR) -- это и есть цель замера.
id: p_dirty_lens
title: "Заляпанный объектив"
lights_off: []
spawn: []
camera:
  smudge: 0.55
  blur_sigma: 1.6
  darkness: 1.0
  noise_sigma: 3.0
  dropout_prob: 0.0
  motion_blur_px: 0
timeout_scale: 1.3
