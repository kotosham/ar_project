# p_carpet -- "ковёр: дополнительное трение и порог"
#
# ЧТО МОДЕЛИРУЕТ
#   Настоящая помеха от ковра для маленького робота -- это не столько трение,
#   сколько КРОМКА. Колесо радиусом 3.8 см заезжает на 2-сантиметровый край:
#   это ступенька в половину радиуса колеса, машина клюёт, одометрия врёт,
#   Nav2 видит рассинхрон между командой и фактическим перемещением.
#   Поэтому floor_carpet -- это коллизионный короб толщиной 0.020 м, а не
#   декоративная плоскость. Плюс mu = 1.6 (против mu 1.0 у колёс), что
#   заметно повышает момент, нужный для разворота на месте.
#
#   Два ковра стоят поперёк коридора -- их не объехать, только переехать:
#     (-3.20, 0.00): x -4.2..-2.2, y -0.8..0.8
#     ( 2.60, 0.00): x  1.6..3.6, y -0.8..0.8
#   Ковёр перекрывает обе полосы движения, поэтому помеха срабатывает в любом
#   сценарии, где робот едет по коридору (то есть во всех, кроме s7 до выхода
#   из кухни).
#
#   Ножки щитов s4/s5 попадают на ковёр -- это нормально и физически корректно
#   (статические тела, контакт не считается).
id: p_carpet
title: "Ковры в коридоре (трение + порог 2 см)"
lights_off: []
spawn:
  - {model: floor_carpet, name: carpet_w, x: -3.20, y: 0.00, z: 0.0, yaw: 0.0}
  - {model: floor_carpet, name: carpet_e, x: 2.60, y: 0.00, z: 0.0, yaw: 0.0}
camera:
  smudge: 0.0
  blur_sigma: 0.0
  darkness: 1.0
  noise_sigma: 0.0
  dropout_prob: 0.0
  motion_blur_px: 0
timeout_scale: 1.4
