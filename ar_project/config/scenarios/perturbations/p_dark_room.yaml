# p_dark_room -- "в комнате выключили свет"
#
# ЧТО МОДЕЛИРУЕТ
#   Робот заезжает в помещение, где не горит свет. Две составляющие, и обе
#   нужны:
#     1) lights_off -- реальное гашение источников в Gazebo через
#        /world/house/light_config. Сцена темнеет ФИЗИЧЕСКИ: тени, контраст и
#        цвет объектов меняются так же, как в жизни. В house.sdf намеренно нет
#        солнца и нет потолка -- освещение держится только на точечных
#        источниках, поэтому их гашение действительно работает
#        (scene ambient 0.30 оставляет сцену различимой, но тусклой).
#     2) camera darkness/noise -- сенсорная часть: матрица в темноте поднимает
#        усиление, картинка становится шумной. Без этого получилась бы
#        "идеально чистая тёмная картинка", чего не бывает.
#
#   Гасятся ванная, кухня и гостиная -- то есть целевые комнаты сценариев
#   s2 (гостиная), s4 (кухня), s5/s6/s7 (ванная). Коридор остаётся освещён,
#   иначе робот не доехал бы вообще ни до чего и все эпизоды падали бы по
#   одинаковой скучной причине.
id: p_dark_room
title: "Выключен свет в целевых комнатах"
lights_off: [light_bathroom, light_kitchen, light_living]
spawn: []
camera:
  smudge: 0.0
  blur_sigma: 0.0
  darkness: 0.45
  noise_sigma: 4.0
  dropout_prob: 0.0
  motion_blur_px: 0
timeout_scale: 1.3
