# p_hard -- "всё сразу": объединение p_dark_room + p_dirty_lens + p_puddle
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ КОМБИНИРОВАННЫЙ ОВЕРЛЕЙ
#   Помехи не складываются линейно. Тёмная комната сама по себе переносима,
#   грязный объектив сам по себе переносим, но темнота + потеря высоких частот
#   выбивают детектор совсем: усиление матрицы поднимает шум ровно в тех
#   пятнах, где грязь уже съела контур. p_hard существует, чтобы это
#   взаимодействие было измеримо, а не додумано: сравнивайте
#   progress(p_hard) с суммой падений от трёх помех по отдельности.
#
#   Значения camera -- НЕ сумма, а максимум/наихудшее по каждому каналу, плюс
#   слегка усиленный шум (5.0 против 4.0 и 3.0): в темноте грязь шумит сильнее.
#   Лужи оставлены как есть -- механика не зависит от освещения.
#   Ковры сюда НЕ входят: p_carpet и p_puddle меняют одно и то же (сцепление),
#   и смешивать их значит терять возможность приписать провал чему-то одному.
id: p_hard
title: "Комбинированная помеха: темнота + грязный объектив + лужи"
lights_off: [light_bathroom, light_kitchen, light_living]
spawn:
  - {model: floor_puddle, name: puddle_bath, x: -0.60, y: 0.00, z: 0.0, yaw: 0.0}
  - {model: floor_puddle, name: puddle_kitchen, x: 4.20, y: 0.20, z: 0.0, yaw: 0.0}
camera:
  smudge: 0.55
  blur_sigma: 1.6
  darkness: 0.45
  noise_sigma: 5.0
  dropout_prob: 0.0
  motion_blur_px: 0
timeout_scale: 1.8
