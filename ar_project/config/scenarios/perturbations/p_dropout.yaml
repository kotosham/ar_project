# p_dropout -- "рваный видеопоток"
#
# ЧТО МОДЕЛИРУЕТ
#   Потерю кадров и смаз при движении -- ровно то, что происходит на реальном
#   железе, когда сжатый поток идёт по Wi-Fi с малинки на edge: часть кадров не
#   доезжает, а те, что доехали, сняты с выдержкой, размазывающей картинку при
#   развороте.
#   dropout_prob 0.25 -- каждый четвёртый кадр не публикуется вообще. Для
#   детектора это означает, что "посмотреть и сразу решить" перестаёт работать:
#   между наблюдением и действием возникает переменная задержка.
#   motion_blur_px 7 -- горизонтальный смаз, самый заметный при TURN. Он
#   избирательно наказывает планировщики, которые вращаются и одновременно
#   пытаются распознавать.
#
#   Это единственная помеха, которая бьёт по ВРЕМЕНИ реакции, а не по качеству
#   отдельного кадра, поэтому её стоит смотреть в паре с vlm_steps и
#   detect_all_calls, а не только с ordered_progress.
id: p_dropout
title: "Потеря кадров и смаз при вращении"
lights_off: []
spawn: []
camera:
  smudge: 0.0
  blur_sigma: 0.0
  darkness: 1.0
  noise_sigma: 0.0
  dropout_prob: 0.25
  motion_blur_px: 7
timeout_scale: 1.3
