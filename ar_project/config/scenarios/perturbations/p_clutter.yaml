# p_clutter -- "захламлённый коридор"
#
# ЧТО МОДЕЛИРУЕТ
#   Загромождение прохода: коробки у стен сужают коридор, порождают ложные
#   срабатывания открытого словаря ("box", "package", "suitcase") и заставляют
#   Nav2 планировать в узком проходе. Это одновременно помеха восприятию
#   (лишние кандидаты в DETECT_ALL, конкурирующие с целью) и помеха исполнению.
#
# ПОЧЕМУ КУЧИ ТОЛЬКО В ВОСТОЧНОЙ ПОЛОВИНЕ
#   В s4/s5 щиты занимают северную полосу западного коридора (y 0.32..1.04), и
#   роботу остаётся южная. Добавить туда ещё и коробки -- значит перекрыть
#   проход полностью и превратить помеху в гарантированный провал по
#   геометрии, а не по восприятию. Поэтому все четыре кучи стоят восточнее
#   x = -0.15, где щитов нет, и чередуются по сторонам, оставляя >0.5 м
#   свободной полосы в каждой точке.
#     (0.30, -0.76): x -0.15..0.80
#     (2.60,  0.76): x  2.15..3.10
#     (4.60, -0.76): x  4.15..5.10
#     (6.20,  0.76): x  5.75..6.70
#   Проверено на непересечение с реквизитом сценариев: s1 clutter_e (2.30,-0.70)
#   и target_chair (5.60, 0.00), s3 decoy (5.00, 0.60), s6 clutter_hall (1.60,-0.70).
id: p_clutter
title: "Захламлённый коридор"
lights_off: []
spawn:
  - {model: clutter_pile, name: c1, x: 0.30, y: -0.76, z: 0.0, yaw: 0.0}
  - {model: clutter_pile, name: c2, x: 2.60, y: 0.76, z: 0.0, yaw: 0.0}
  - {model: clutter_pile, name: c3, x: 4.60, y: -0.76, z: 0.0, yaw: 0.0}
  - {model: clutter_pile, name: c4, x: 6.20, y: 0.76, z: 0.0, yaw: 0.0}
camera:
  smudge: 0.0
  blur_sigma: 0.0
  darkness: 1.0
  noise_sigma: 0.0
  dropout_prob: 0.0
  motion_blur_px: 0
timeout_scale: 1.3
