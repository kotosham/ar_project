# p_puddle -- "лужа: проскальзывание колёс"
#
# ЧТО МОДЕЛИРУЕТ
#   Пролитая вода. floor_puddle -- плёнка толщиной 4 мм (порога нет, наехать
#   можно не заметив) с mu = mu2 = 0.02 против 1.0 у колёс. Плагин
#   gz::sim::systems::DiffDrive задаёт СКОРОСТЬ суставов, а сцепление считает
#   физика контакта, поэтому низкое mu даёт настоящее проскальзывание: колёса
#   крутятся, робот едет медленнее команды, а на развороте его сносит.
#   Для стека это выглядит как расхождение одометрии с реальностью -- то же,
#   что происходит на кафеле в жизни.
#
#   Лужи стоят в двух местах коридора, где робот обычно уже разогнался:
#     (-0.60, 0.00): x -1.3..0.1, y -0.6..0.6  -- прямо перед дверью ванной,
#                    то есть в точке, где нужен аккуратный поворот (s5/s6/s7)
#     ( 4.20, 0.20): x  3.5..4.9, y -0.4..0.8  -- перед кухонной дверью (s4)
id: p_puddle
title: "Лужи в коридоре (проскальзывание)"
lights_off: []
spawn:
  - {model: floor_puddle, name: puddle_bath, x: -0.60, y: 0.00, z: 0.0, yaw: 0.0}
  - {model: floor_puddle, name: puddle_kitchen, x: 4.20, y: 0.20, z: 0.0, yaw: 0.0}
camera:
  smudge: 0.0
  blur_sigma: 0.0
  darkness: 1.0
  noise_sigma: 0.0
  dropout_prob: 0.0
  motion_blur_px: 0
timeout_scale: 1.4
