# s2_occlusion -- "цель частично перекрыта"
#
# ЧТО ДИАГНОСТИРУЕТ
#   Меняет ли планировщик точку обзора, когда grounding не даётся с текущей.
#   Бутылка стоит в гостиной за непрозрачной ширмой. Из дверного проёма
#   гостиной (x 2.40..3.50 на стене y = -1.1) линия взгляда на бутылку
#   (3.90, -3.60) проходит ровно через ширму (3.90, -2.70), поэтому детектор
#   первым делом видит ширму, а не цель.
#   Корректная стратегия: войти в комнату, сместиться вбок (DRIVE_FORWARD +
#   TURN или DRIVE_TO_VISIBLE по промежуточному объекту) и переспросить
#   детектор. Провал типовой: бесконечный DETECT_ALL с одной и той же позиции.
#
# ПОЧЕМУ ШИРМА НА x = 3.90, А НЕ НА 3.10
#   На 3.10 она пересекалась бы с living_table (x 2.0..3.0), а два статических
#   тела внахлёст дают некорректный костмап.
id: s2_occlusion
title: "Цель частично перекрыта"
description: >-
  Бутылка в гостиной скрыта ширмой ровно на линии взгляда от двери.
  Диагностирует смену ракурса ради grounding'а.
mission: bottle

robot_start: {x: 0.50, y: -0.30, yaw: 0.0}

spawn:
  - {model: target_bottle, name: target, x: 3.90, y: -3.60, z: 0.0, yaw: 0.0}
  # yaw 0 -> плоскость ширмы поперёк линии взгляда от двери гостиной.
  - {model: occluder_screen, name: screen, x: 3.90, y: -2.70, z: 0.0, yaw: 0.0}

lights_off: []

subgoals:
  - {id: g1_in_living, type: in_room, room: living}
  - {id: g2_saw_bottle, type: saw_label, label: bottle, min_conf: 0.12}
  - {id: g3_at_target, type: near_xy, x: 3.90, y: -3.00, radius: 0.95}

success: {type: all_subgoals}
timeout_s: 200
max_path_m: 30.0
diagnoses: [occlusion, viewpoint_change, grounding]
