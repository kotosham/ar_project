# s3_behind -- "цель позади робота"
#
# ЧТО ДИАГНОСТИРУЕТ
#   Выполняет ли планировщик активный поиск, когда цели нет в кадре. Робот
#   стоит в коридоре лицом на восток, мяч -- в 6.2 м ПОЗАДИ. В стартовом кадре
#   цели нет вообще; впереди зато стоит куча коробок -- приманка для жадной
#   политики "еду к тому, что вижу".
#   Корректная стратегия: TURN на ~180 градусов (или серия TURN) до появления
#   мяча, затем подход. Провал типовой: DRIVE_TO_VISIBLE по приманке или
#   уход в фронтир-исследование восточной половины дома.
#
# ПОРЯДОК SUBGOAL'ов ВАЖЕН
#   faced_xy стоит ПЕРВЫМ: ordered_progress тогда честно показывает, что робот
#   сначала развернулся, а не набрёл на мяч случайно, откатившись назад.
id: s3_behind
title: "Цель позади робота"
description: >-
  Мяч в 6.2 м за спиной, приманка -- впереди. Диагностирует поворот-до-поездки
  и устойчивость к жадному выбору видимого объекта.
mission: sports ball

robot_start: {x: 1.00, y: 0.00, yaw: 0.0}

spawn:
  - {model: target_ball, name: target, x: -5.20, y: 0.20, z: 0.0, yaw: 0.0}
  # Приманка строго в стартовом кадре: bearing ~7 градусов, дистанция 4 м.
  - {model: clutter_pile, name: decoy, x: 5.00, y: 0.60, z: 0.0, yaw: 0.0}

lights_off: []

subgoals:
  - {id: g1_turned_around, type: faced_xy, x: -5.20, y: 0.20, tol_rad: 0.50}
  - {id: g2_saw_ball, type: saw_label, label: sports ball, min_conf: 0.12}
  - {id: g3_at_target, type: near_xy, x: -4.30, y: 0.20, radius: 0.90}

success: {type: all_subgoals}
timeout_s: 200
max_path_m: 30.0
diagnoses: [out_of_view, active_search, turn_before_drive]
