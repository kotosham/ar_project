controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_cont:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    use_urdf_to_filter: true
    publish_dynamic_joint_states: false

diff_cont:
  ros__parameters:
    publish_rate: 50.0

    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.35
    wheel_radius: 0.038
    wheels_per_side: 1
    # Keep the nominal geometry above equal to the measured robot dimensions.
    # Use the multipliers below for empirical odometry calibration on hardware:
    # - wheel_separation_multiplier mostly affects yaw / turning accuracy
    # - left/right_wheel_radius_multiplier can compensate asymmetric straight drift
    wheel_separation_multiplier: 1.0052
    left_wheel_radius_multiplier: 1.0249
    right_wheel_radius_multiplier: 1.0249

    odom_frame_id: odom
    base_frame_id: base_link
    # EKF publishes the authoritative odom -> base_link transform.
    # Keep the raw wheel odometry on /diff_cont/odom, but avoid conflicting TFs.
    enable_odom_tf: false

    position_feedback: true
    open_loop: false
    # hardware_bringup converts twist_mux output to TwistStamped on /diff_cont/cmd_vel.
    use_stamped_vel: true

    cmd_vel_timeout: 0.5
    velocity_rolling_window_size: 10
    publish_limited_velocity: true

    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

    linear.x.max_velocity: 0.24
    linear.x.min_velocity: -0.24
    linear.x.max_acceleration: 0.5
    linear.x.max_deceleration: -0.5
    linear.x.max_acceleration_reverse: -0.5
    linear.x.max_deceleration_reverse: 0.5
    linear.x.max_jerk: .NAN
    linear.x.min_jerk: .NAN

    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 2.0
    angular.z.max_deceleration: -2.0
    angular.z.max_acceleration_reverse: -2.0
    angular.z.max_deceleration_reverse: 2.0
    angular.z.max_jerk: .NAN
    angular.z.min_jerk: .NAN
