imu_filter_madgwick:
  ros__parameters:
    stateless: false
    use_mag: false
    publish_tf: false
    reverse_tf: false
    fixed_frame: "odom"
    constant_dt: 0.0
    publish_debug_topics: false
    world_frame: "enu"
    gain: 0.05
    zeta: 0.0
    # Non-zero covariance makes EKF treat the estimated orientation as a real
    # measurement instead of an effectively perfect one.
    orientation_stddev: 0.05
