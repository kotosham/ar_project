options:
  dcf_path: "@BUS_CONFIG_PATH@"

master:
  node_id: 6
  driver: "ros2_canopen::MasterDriver"
  package: "canopen_master_driver"
  namespace: "/"
  sync_period: 20000  # us -> 50 Hz bus cycle
  boot_time: 20000
  boot_timeout: 5000

defaults:
  dcf: "maxon_motor_EPOS4_0170h_6150h_0000h_0000h.eds"
  driver: "ros2_canopen::Cia402Driver"
  package: "canopen_402_driver"
  period: 20
  polling: true
  # Give occasional SDO diagnostics a bit more margin on the Pi.
  sdo_timeout_ms: 100
  diagnostics:
    enable: false
  heartbeat_producer: 2000
  boot_timeout_ms: 10000
  reset_communication: true

  # EPOS4 reports position in quadrature counts and velocity in rpm.
  # Hardware combination:
  # - encoder 225778 -> 500 cpt => 2000 qc / motor rev
  # - gearhead 166935 -> exact reduction 299/14
  # These scales convert motor-side EPOS4 units to wheel-side SI units.
  scale_pos_to_dev: 6798.1897120681015
  scale_pos_from_dev: 0.00014709798378012407
  scale_vel_to_dev: 203.94569136204305
  scale_vel_from_dev: 0.004903266126004136

  velocity_mode: 9

  sdo:
    - {index: 0x6040, sub_index: 0, value: 0x80}   # fault reset
    - {index: 0x6040, sub_index: 0, value: 0x06}
    - {index: 0x6040, sub_index: 0, value: 0x07}
    - {index: 0x60C2, sub_index: 1, value: 20}     # interpolation time = 20 ms
    - {index: 0x60C2, sub_index: 2, value: -3}
    - {index: 0x6081, sub_index: 0, value: 1000}   # profile velocity [rpm]
    - {index: 0x6083, sub_index: 0, value: 2000}   # profile acceleration [rpm/s]
    # RobotSystem activates CiA402 drives through handleInit(), which always
    # performs an enable sequence followed by homing. For a wheel drive without
    # a separate homing sensor we use EPOS4 method 37: accept the current
    # encoder position as the home position and complete immediately.
    - {index: 0x6098, sub_index: 0, value: 37}     # homing method = current position
    - {index: 0x6060, sub_index: 0, value: 9}      # cyclic synchronous velocity mode

  tpdo:
    1:
      enabled: true
      cob_id: "auto"
      transmission: 0x01
      mapping:
        - {index: 0x6041, sub_index: 0}  # status word
        - {index: 0x6061, sub_index: 0}  # mode of operation display
        # Publish torque actual value via TPDO so the CiA402 driver doesn't
        # fall back to SDO reads for 0x6077 in its background joint-state publisher.
        - {index: 0x6077, sub_index: 0}  # torque actual value
    2:
      enabled: true
      cob_id: "auto"
      transmission: 0x01
      mapping:
        - {index: 0x6064, sub_index: 0}  # position actual value
        - {index: 0x606C, sub_index: 0}  # velocity actual value
    3:
      enabled: false
    4:
      enabled: false

  rpdo:
    1:
      enabled: true
      cob_id: "auto"
      transmission: 0x01
      mapping:
        - {index: 0x6040, sub_index: 0}  # control word
        - {index: 0x6060, sub_index: 0}  # mode of operation
    2:
      enabled: true
      cob_id: "auto"
      transmission: 0x01
      mapping:
        - {index: 0x60FF, sub_index: 0}  # target velocity
    3:
      enabled: false
    4:
      enabled: false

nodes:
  left_wheel_joint:
    node_id: 1
    namespace: "/"
    direction_sign: 1.0
  right_wheel_joint:
    node_id: 2
    namespace: "/"
    direction_sign: -1.0
