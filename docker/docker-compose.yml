# Automatic PC stack bringup. Profiles select which part of the stack to run:
#   docker compose --profile sim  up   # full FLAT simulation, one CPU container
#   docker compose --profile edge up   # detector (GPU) + VLM orchestrator
#   docker compose --profile all  up   # everything at once, RAM-heavy; see README
# Build context is the parent of ar_project so both repositories are visible.
name: mrn

x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}

services:
  # Full FLAT simulation stack (Gazebo + RTAB-Map + Nav2 + executive) in one container.
  # flat_sim_bringup already starts gui:=false (headless), so no display is required.
  sim:
    build:
      context: ../..
      dockerfile: ar_project/docker/Dockerfile
      target: sim
    image: mrn/sim:${ROS_DISTRO:-jazzy}
    environment: *ros-env
    command: ["ros2", "launch", "ar_project", "flat_sim_bringup.launch.py"]
    shm_size: "1gb"
    stop_grace_period: 15s
    profiles: ["sim", "all"]

  # YOLOE detector (edge, GPU). Weights are mounted into the package share path.
  detector:
    build:
      context: ../..
      dockerfile: ar_project/docker/Dockerfile
      target: edge
    image: mrn/edge:${ROS_DISTRO:-jazzy}
    environment: *ros-env
    command:
      - "/opt/ot_venv/bin/python"
      - "/ws/install/object_tracking/lib/object_tracking/detect_target_server"
      - "--ros-args"
      - "-p"
      - "use_sim_time:=true"
    volumes:
      - ../../object_tracking/object_tracking/object_tracking/model_weights:/ws/install/object_tracking/share/object_tracking/model_weights:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["edge", "all"]

  # VLM orchestrator (edge). VLM credentials come from vlm.env. The file content
  # is not read by tools here; it is only connected as env_file. With
  # required:false, the orchestrator starts in mock mode when the file is absent.
  orchestrator:
    image: mrn/edge:${ROS_DISTRO:-jazzy}
    build:
      context: ../..
      dockerfile: ar_project/docker/Dockerfile
      target: edge
    environment: *ros-env
    env_file:
      - path: ../../object_tracking/planner_orchestrator/vlm.env
        required: false
    command: ["ros2", "run", "planner_orchestrator", "orchestrator_node"]
    depends_on: [detector]
    profiles: ["edge", "all"]
