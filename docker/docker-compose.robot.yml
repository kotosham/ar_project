# Оверлей подключения консоли к РЕАЛЬНОМУ роботу (Pi + edge-бокс).
# Применяется поверх базового файла и только с профилем console:
#   EDGE_HOST=192.168.1.10 docker compose -f docker-compose.yml -f docker-compose.robot.yml \
#     --profile console up
# Проще: ./run.sh robot 192.168.1.10   (Windows: .\run.ps1 robot 192.168.1.10)
#
# ---------------------------------------------------------------------------
# ПОЧЕМУ ИМЕННО ТАК, А НЕ network_mode: host
# ---------------------------------------------------------------------------
# network_mode: host есть только в Docker на Linux. В Docker Desktop (Windows, macOS)
# контейнеры живут в виртуальной машине, и host-режим не даёт доступа к сети хоста —
# а multicast-обнаружение DDS через NAT не проходит ни при каких настройках.
# Сессия zenoh в режиме client делает РОВНО ОДНО ИСХОДЯЩЕЕ TCP-соединение на
# tcp/<edge>:7447. Исходящий TCP из контейнера через bridge+NAT работает одинаково на
# Linux, Windows и macOS; входящих портов и проброса не требуется. Роутер поднят
# только на edge (systemd rmw-zenoh-router.service, см. deploy/transport/).
#
# ---------------------------------------------------------------------------
# ЧТО СДЕЛАТЬ ПЕРЕД ЗАПУСКОМ
# ---------------------------------------------------------------------------
#   1. На edge:  bash deploy/transport/install_transport.sh edge <IP_EDGE>
#   2. На Pi:    bash deploy/transport/install_transport.sh pi   <IP_EDGE>
#   3. На ПК:    задать EDGE_HOST в docker/.env
#   4. Проверить, что порт роутера виден с ПК:
#        Linux/macOS: nc -vz $EDGE_HOST 7447
#        Windows:     Test-NetConnection -ComputerName $env:EDGE_HOST -Port 7447
#
# ---------------------------------------------------------------------------
# ЧЕСТНО: межхостовой zenoh Pi <-> edge в репозитории ЕЩЁ НЕ ВАЛИДИРОВАН.
# deploy/transport/README.md:63-65 прямо помечает измерение межхостового джиттера как
# «в ожидании»: проверен только один хост в WSL. Этот файл — прямое применение уже
# проверенной конфигурации client-режима к контейнеру, а не подтверждённый замер.
# ---------------------------------------------------------------------------
services:
  console:
    environment:
      # На железном пути домен нигде не задаётся: Pi и edge работают в домене по
      # умолчанию, то есть 0. Оставить здесь 42 из симуляционного профиля значит молча
      # оказаться в ДРУГОМ графе — узлы поднимутся, а робота «не будет видно».
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      # Сессионный конфиг монтируется файлом ниже. Без него сессия поднимется в
      # ДЕФОЛТНОМ режиме peer + multicast — ровно в том, который репозиторий уже признал
      # сломанным: peer/gossip заставлял узлы Pi открывать прямые process-to-process
      # TCP-линки к узлам edge и перегружал сторону управления роботом
      # (zenoh_session_config.json5:16-19). mode:"client" и выключенный scouting заданы
      # именно в этом файле (строки 14 и 20-23), переменными их не заменить целиком.
      ZENOH_SESSION_CONFIG_URI: /etc/zenoh/zenoh_session_config.json5
      # Переопределение нужно ПОЛНЫМ набором ключей, а не одним connect/endpoints:
      # в смонтированном json5 адрес роутера записан литералом EDGE_HOST (строка 36) —
      # его подставляет install_transport.sh на Pi/edge, но в контейнере подстановки
      # не было. Мы перезаписываем endpoints целиком, а mode и scouting повторяем явно,
      # чтобы значения не зависели от того, чей именно json5 смонтировали.
      ZENOH_CONFIG_OVERRIDE: 'mode="client";scouting/multicast/enabled=false;scouting/gossip/enabled=false;connect/endpoints=["tcp/${EDGE_HOST}:7447"]'
      # -1 = ретраить ожидание роутера бесконечно. Любое положительное значение убивает
      # процесс, если роутер ещё не поднят, — то есть контейнер умирал бы ровно в
      # сценарии, ради которого консоль и написана: «включил консоль и жду робота».
      ZENOH_ROUTER_CHECK_ATTEMPTS: "-1"
      # Обязательная преамбула всех железных терминалов из RUNBOOK: демон ros2cli
      # кеширует граф и под zenoh даёт устаревшие списки узлов и топиков.
      ROS_DISABLE_ROS2CLI_DAEMON: "1"
      # Дашборд живёт на edge-боксе (его поднимает edge-слой ТАМ), а не в этом
      # контейнере: консоль только проксирует его на /dashboard/.
      DASHBOARD_URL: "http://${EDGE_HOST}:8088"
    volumes:
      # ro: конфиг принадлежит репозиторию, контейнер его только читает.
      - ../deploy/transport/zenoh_session_config.json5:/etc/zenoh/zenoh_session_config.json5:ro
