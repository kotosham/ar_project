# chrony — Pi (executive). Disciplines tightly to the EDGE time master so the
# Pi<->edge clock OFFSET stays far below the matching windows (ROADMAP 1.2, [FMEA]):
#   TF transform_tolerance   0.2  s
#   depth<->color match      0.35 s
#   pixel-age (detections)   1.5  s
#
# Install: sudo cp chrony-pi.conf /etc/chrony/chrony.conf  (edit EDGE_HOST)
#          sudo systemctl restart chrony

# Single authoritative source: the edge. Aggressive polling on the dedicated LAN
# (minpoll/maxpoll 4-16 s) for fast convergence and a small steady-state offset.
server EDGE_HOST iburst minpoll 2 maxpoll 4 prefer

# Step the clock on a large initial error (first 3 updates), slew small errors
# smoothly afterwards so timestamps never jump backwards mid-mission.
makestep 0.5 3
rtcsync

driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
# Log measurements/statistics/tracking so the offset proof is auditable offline.
log measurements statistics tracking
