# chrony — EDGE host. Local time master for the Pi<->edge fleet (ROADMAP 1.2).
#
# The edge disciplines to upstream NTP when reachable AND serves the fleet even
# when offline (local stratum), so the RELATIVE offset across hosts stays tiny
# regardless of internet — which is what the sync windows actually care about.
#
# Install: sudo cp chrony-edge.conf /etc/chrony/chrony.conf
#          sudo systemctl restart chrony

# Upstream sources (use the NTP pool; harmless if the edge is sometimes offline).
pool 2.debian.pool.ntp.org iburst maxsources 4

# Serve time to the robot subnet. TIGHTEN this CIDR to your actual LAN.
allow 192.168.0.0/16

# Keep serving a stable local time if upstream is lost, so the Pi stays locked
# to the edge no matter what. Stratum 10 is below any real upstream.
local stratum 10

# Fast initial correction, then smooth discipline.
makestep 1.0 3
rtcsync

driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
