# ROS 2 transport socket buffers — ROADMAP Phase 1.1.
#
# 12 MB max so both the Fast DDS LARGE_DATA fallback and the zenoh TCP links can
# buffer image/scan bursts over Wi-Fi without drops or head-of-line stalls.
# Apply on EVERY host (Pi + edge):
#   sudo cp 99-ros2-socket-buffers.conf /etc/sysctl.d/
#   sudo sysctl --system
# Verify: sysctl net.core.rmem_max  -> 12582912
net.core.rmem_max = 12582912
net.core.wmem_max = 12582912
net.core.rmem_default = 12582912
net.core.wmem_default = 12582912
